<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- CSRF token, if your plugin need to make POST request to backend -->
    <meta name="zoraxy.csrf.Token" content="{{.csrfToken}}">
    <title>Zoraxy Crowdsec Bouncer Debug UI</title>
    <link rel="stylesheet" href="/script/semantic/semantic.min.css">
    <script src="/script/jquery-3.6.0.min.js"></script>
    <script src="/script/semantic/semantic.min.js"></script>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
<!-- Dark theme script must be included after body tag-->
<link rel="stylesheet" href="/darktheme.css">
<script src="/script/darktheme.js"></script>
<div class="ui container">
	<div class="ui basic segment">
		<h1>Zoraxy Crowdsec Bouncer Debug UI</h1>

		<div id="config-status-container"></div>
		
		<h2>Plugin Information</h2>
		<p>Version: <span id="version-info">Loading...</span></p>
		<p>
			GitHub Repository: <a href="https://github.com/yuyutti/zoraxy_crowdsec_bouncer">https://github.com/yuyutti/zoraxy_crowdsec_bouncer</a>
		</p>
	</div>
    <div class="ui divider"></div>

	<div class="ui basic segment">
		<h2>Metrics</h2>
		<button id="refresh-btn" class="ui basic small button" onclick="refreshMetrics()">
			<i class="refresh icon"></i>
			Refresh
		</button>

		<div class="metrics-dashboard" id="metrics-dashboard">
			<div class="metric-card">
				<div class="metric-title">Loading...</div>
				<div class="metric-description">Please wait while metrics are loading</div>
			</div>
		</div>
	</div>
	
	<div class="ui divider"></div>

	<div class="ui basic segment">
        <h2>This management request's headers (sensitive values redacted)</h2>
    	<pre id="headers-display">Loading...</pre>
	</div>

</div>

    <script>
        'use strict';
        let refreshing = false;
        async function api(name) {
            const response = await fetch('./api/' + name, {cache: 'no-store'});
            if (!response.ok) throw new Error('Request failed: HTTP ' + response.status);
            return await response.json();
        }
        function textElement(tag, text, className) {
            const element = document.createElement(tag);
            element.textContent = String(text);
            if (className) element.className = className;
            return element;
        }
        async function fetchVersion() {
            const target = document.getElementById('version-info');
            const data = await api('version');
            target.replaceChildren(document.createTextNode(data.version || 'Unknown'));
            if (data.checkError) {
                const message = textElement('span', ' (update check unavailable)');
                message.setAttribute('title', data.checkError);
                target.append(message);
            } else if (data.updateLink) {
                const url = new URL(data.updateLink);
                if (url.protocol === 'https:' && url.hostname === 'github.com' && url.pathname.startsWith('/yuyutti/zoraxy_crowdsec_bouncer/releases/tag/')) {
                    const link = textElement('a', ' (update available)');
                    link.setAttribute('href', url.href);
                    target.append(link);
                }
            } else {
                target.append(document.createTextNode(data.latest ? ' (up to date)' : ' (no published stable fork release)'));
            }
        }
        async function fetchMetrics() {
            const target = document.getElementById('metrics-dashboard');
            const data = await api('metrics');
            if (data.error) throw new Error(data.error);
            const cards = [];
            for (const [title, values] of [['BAN matches', data.blockedRequests || {}], ['Processed requests', data.processedRequests || {}]]) {
                const card = textElement('div', '', 'metric-card');
                const total = Object.values(values).reduce((sum, value) => sum + (Number(value) || 0), 0);
                card.append(textElement('div', title, 'metric-title'), textElement('div', total, 'metric-value'));
                for (const [host, count] of Object.entries(values)) card.append(textElement('div', host + ': ' + (Number(count) || 0), 'metric-breakdown-item'));
                cards.push(card);
            }
            const rate = textElement('div', '', 'metric-card');
            rate.append(textElement('div', 'BAN match rate', 'metric-title'), textElement('div', (Number(data.blockRate) || 0).toFixed(1) + '%', 'metric-value'));
            cards.push(rate);
            target.replaceChildren(...cards);
        }
        async function fetchConfigStatus() {
            const data = await api('config-status');
            const target = document.getElementById('config-status-container');
            const panel = textElement('div', '', 'ui message');
            panel.append(textElement('strong', 'State: ' + (data.state || 'unknown')));
            panel.append(textElement('p', data.message || (data.initialSyncComplete ? 'Initial synchronization complete.' : 'Protection is not ready.')));
            panel.append(textElement('p', 'Active decisions: ' + (data.activeDecisions || 0) + ' / IP resolution errors: ' + (data.ipResolutionErrors || 0) + ' / Invalid decisions: ' + (data.invalidDecisions || 0)));
            panel.append(textElement('p', 'Last sync: ' + (data.lastSyncSuccess || 'none') + ' / Policy: ' + (data.failurePolicy || 'unknown')));
            if (data.lastFailure) panel.append(textElement('p', 'Last failure: ' + data.lastFailure));
            if (data.missingFields && data.missingFields.length) panel.append(textElement('p', 'Missing: ' + data.missingFields.join(', ')));
            target.replaceChildren(panel);
        }
        async function fetchHeaders() {
            const data = await api('headers');
            const headers = data.headers || {};
            const lines = [];
            for (const key of Object.keys(headers).sort()) {
                for (const value of (Array.isArray(headers[key]) ? headers[key] : [])) lines.push(key + ': ' + value);
            }
            document.getElementById('headers-display').textContent = lines.join('\n') || 'No headers.';
        }
        async function showResult(action, targetId) {
            try { await action(); }
            catch (error) { document.getElementById(targetId).textContent = error.message || 'Request failed.'; }
        }
        async function refreshMetrics() {
            if (refreshing) return;
            refreshing = true;
            const button = document.getElementById('refresh-btn');
            button.disabled = true;
            button.classList.add('loading');
            try {
                await Promise.all([showResult(fetchMetrics, 'metrics-dashboard'), showResult(fetchConfigStatus, 'config-status-container')]);
            } finally {
                button.disabled = false;
                button.classList.remove('loading');
                refreshing = false;
            }
        }
        document.addEventListener('DOMContentLoaded', () => Promise.all([
            showResult(fetchVersion, 'version-info'),
            showResult(fetchMetrics, 'metrics-dashboard'),
            showResult(fetchConfigStatus, 'config-status-container'),
            showResult(fetchHeaders, 'headers-display')
        ]));
    </script>
</body>
</html>
