name: Publish fork release
on:
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            version:
                description: 'Exact source version/tag (for example v1.2.4-1)'
                required: true
                type: string
            prerelease:
                description: 'Publish as an evaluation prerelease'
                default: true
                type: boolean
permissions:
    contents: read
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false
jobs:
    metadata:
        if: github.repository == 'yuyutti/zoraxy_crowdsec_bouncer'
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.metadata.outputs.version }}
            prerelease: ${{ steps.metadata.outputs.prerelease }}
        steps:
            - uses: actions/checkout@v4
            - name: Check version, repository and event
              id: metadata
              env:
                  REQUESTED_VERSION: ${{ inputs.version }}
                  REQUESTED_PRERELEASE: ${{ inputs.prerelease }}
              run: python3 tools/verify_release.py --event
    verify:
        needs: metadata
        uses: ./.github/workflows/CI.yml
    release:
        needs: [metadata, verify]
        permissions:
            contents: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/download-artifact@v4
              with:
                  pattern: zoraxycrowdsecbouncer_*
                  path: dist
                  merge-multiple: true
            - name: Verify and assemble assets from this run
              env:
                  RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
              run: python3 tools/prepare_release.py
            - name: Publish verified fork assets
              uses: actions/github-script@v7
              env:
                  RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
                  RELEASE_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
              with:
                  script: |
                      const fs = require('fs');
                      const crypto = require('crypto');
                      const owner = 'yuyutti';
                      const repo = 'zoraxy_crowdsec_bouncer';
                      if (context.repo.owner !== owner || context.repo.repo !== repo) {
                          throw new Error('Release repository mismatch');
                      }
                      const tag = process.env.RELEASE_VERSION;
                      const prerelease = process.env.RELEASE_PRERELEASE === 'true';
                      let commit = context.sha;
                      try {
                          const ref = await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
                          let object = ref.data.object;
                          while (object.type === 'tag') {
                              object = (await github.rest.git.getTag({owner, repo, tag_sha: object.sha})).data.object;
                          }
                          if (object.sha !== commit) throw new Error('Tag points to a different SHA');
                      } catch (error) {
                          if (error.status !== 404) throw error;
                          if (context.eventName !== 'workflow_dispatch') throw new Error('Expected version tag does not exist');
                          // Manual publication creates the tag only after verify succeeds.
                          await github.rest.git.createRef({owner, repo, ref: `refs/tags/${tag}`, sha: commit});
                      }
                      const existing = await github.rest.repos.listReleases({owner, repo, per_page: 100});
                      if (existing.data.some(release => release.tag_name === tag)) {
                          throw new Error('Release already exists; refusing to overwrite assets');
                      }
                      const files = fs.readdirSync('dist').sort();
                      const notes = fs.readFileSync('dist/release-notes.md', 'utf8');
                      const release = (await github.rest.repos.createRelease({
                          // The exact tag has already been resolved/created above. Supplying
                          // target_commitish is unnecessary and can require workflow-write
                          // permission when a work branch changes workflow files.
                          owner, repo, tag_name: tag,
                          name: tag, body: notes, draft: true, prerelease,
                          make_latest: 'false'
                      })).data;
                      for (const name of files) {
                          const data = fs.readFileSync(`dist/${name}`);
                          const uploaded = (await github.rest.repos.uploadReleaseAsset({
                              owner, repo, release_id: release.id, name, data,
                              headers: {'content-type': 'application/octet-stream', 'content-length': data.length}
                          })).data;
                          const digest = `sha256:${crypto.createHash('sha256').update(data).digest('hex')}`;
                          if (uploaded.size !== data.length || (uploaded.digest && uploaded.digest !== digest)) {
                              throw new Error(`Uploaded asset verification failed: ${name}`);
                          }
                      }
                      const assets = (await github.rest.repos.listReleaseAssets({owner, repo, release_id: release.id, per_page: 100})).data;
                      if (assets.length !== files.length || !files.every(name => assets.some(asset => asset.name === name))) {
                          throw new Error('Incomplete release assets; leaving draft unpublished');
                      }
                      const published = (await github.rest.repos.updateRelease({
                          owner, repo, release_id: release.id, draft: false,
                          prerelease, make_latest: prerelease ? 'false' : 'true'
                      })).data;
                      await core.summary.addLink(`Published ${tag}`, published.html_url).write();
