name: CI
on:
    push:
        branches: ['**']
    pull_request:
        branches: [main]
    workflow_dispatch:
    workflow_call:
permissions:
    contents: read
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    checks:
        if: github.repository == 'yuyutti/zoraxy_crowdsec_bouncer'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
            - run: go mod download
            - run: go test ./... -coverprofile=coverage.out
            - run: go test -race ./...
            - run: go vet ./...
            - run: go build ./...
            - run: python3 tools/check_introspection.py
            - run: python3 tools/verify_release.py
            - run: python3 -m unittest discover -s tools -p test_release.py
            - run: make -n test-env-ready
            - run: make -n -j8 test-env-ready
            - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
            - run: staticcheck ./...
            - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
            - run: govulncheck ./...
            - run: go test ./mod/utils -run '^$' -fuzz FuzzIPResolver -fuzztime 1000000x -parallel 4 -timeout 5m
            - run: go test ./mod/zoraxy_plugin -run '^$' -fuzz FuzzSniffPayload -fuzztime 1000000x -parallel 4 -timeout 5m
            - run: go test ./mod/dynamiccapture -run '^$' -fuzz FuzzBlockRequest -fuzztime 1000000x -parallel 4 -timeout 5m
            - run: node --test tools/ui.test.cjs
    binaries:
        needs: checks
        uses: ./.github/workflows/build.yml
    integration:
        needs: checks
        uses: ./.github/workflows/E2E.yml
