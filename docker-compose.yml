networks:
    zoraxy-shared:
        name: zoraxy-crowdsec-bouncer_default
        enable_ipv6: true
        ipam:
            config:
                -   subnet: 172.30.88.0/24
                -   subnet: fd72:30:88::/64
services:
    crowdsec:
        image: crowdsecurity/crowdsec:v1.7.8
        container_name: crowdsec-bouncer-crowdsec
        restart: unless-stopped
        networks:
            - zoraxy-shared
        volumes:
            - ./build/crowdsec/config/:/etc/crowdsec/
            - ./build/crowdsec/data/:/var/lib/crowdsec/data/
    zoraxy:
        image: ${ZORAXY_IMAGE:-zoraxydocker/zoraxy:v3.2.9}
        container_name: crowdsec-bouncer-zoraxy
        restart: unless-stopped
        depends_on:
            - crowdsec
        ports:
            - 127.0.0.1:18080:80
            - 127.0.0.1:8443:443
            - 127.0.0.1:8000:8000
        networks:
            - zoraxy-shared
        volumes:
            - ./build/config/:/opt/zoraxy/config/
            - ./build/plugins/:/opt/zoraxy/plugin/
            - /etc/localtime:/etc/localtime:ro
        extra_hosts:
            - host.docker.internal:host-gateway
        environment:
            FASTGEOIP: 'true'
            CFGUPGRADE: 'false'
    test_webserver:
        image: hashicorp/http-echo:1.0
        container_name: crowdsec-bouncer-test-webserver
        restart: unless-stopped
        command:
            - -listen=:5678
            - -text=Zoraxy CrowdSec Bouncer E2E test server is reachable
        expose:
            - '5678'
        networks:
            zoraxy-shared:
                aliases:
                    - test-webserver
    test_client:
        image: curlimages/curl:8.17.0
        profiles:
            - e2e
        entrypoint:
            - sleep
            - infinity
        networks:
            zoraxy-shared:
                ipv4_address: 172.30.88.20
                ipv6_address: fd72:30:88::20
