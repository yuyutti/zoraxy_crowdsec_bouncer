# CrowdSec Bouncer - yuyutti fork v1.2.4-1
api_key: <CROWDSEC_BOUNCER_API_KEY>
agent_url: http://127.0.0.1:8080
stream_update_frequency: 10s
log_level: warning
is_proxied_behind_cloudflare: true
# Empty lists trust no arbitrary forwarding peers.
trusted_proxies: []
# Only relays that validate Cloudflare peers and overwrite CF headers.
cloudflare_trusted_relays:
    - 10.20.0.6/32
block_response:
    status_code: 403
    page: default
